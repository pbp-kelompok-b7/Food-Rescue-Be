services:
  db:
    image: postgres:16-alpine
    container_name: food-rescue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_rescue}
      POSTGRES_USER: ${POSTGRES_USER:-food_rescue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

